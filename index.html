<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Tarsier Research</title>

<style>
:root{--navy:#1B2A41;--navy2:#2B3F5C;--gold:#C9962E;--ink:#1F2933;--muted:#6B7785;--line:#D9DEE5;--bg:#EEF1F5;
--card:#fff;--soft:#F4F6F8;--ok:#1E7B34;--bad:#B3261E;--blue:#1437C8;
--gA:#1E7B34;--gB:#5FA463;--gC:#D9A320;--gD:#E07B39;--gF:#B3261E;--gN:#9AA5B4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",Roboto,system-ui,-apple-system,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;
padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header img{width:32px;height:32px;border-radius:7px}
header .brand{font:700 21px Georgia,serif;letter-spacing:.2px}
header .sub{font:700 10px "Segoe UI",sans-serif;color:#93A1B8;letter-spacing:1.5px;margin-top:6px}
header .back{background:none;border:0;color:#fff;font-size:24px;padding:0 6px 0 0;cursor:pointer;display:none}
header.has-back .back{display:block}
header .grow{flex:1}
header .tag{font:10px Consolas,monospace;color:var(--gold);text-align:right;line-height:1.3}
main{padding:12px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;
padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
nav a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav a.on{color:var(--navy)}
nav a.on svg{stroke:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.mkt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mkt div{background:var(--soft);border-radius:10px;padding:8px 9px}
.mkt .k{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.mkt .p{font-size:17px;font-weight:700;white-space:nowrap}
.mkt .y{font-size:12px;font-weight:700}
.mkt .a{font-size:10.5px;color:var(--muted)}
.warn{background:#FFF8D6;border:2px solid #F2CC3D;border-radius:12px;padding:12px 14px;margin-bottom:10px;color:#3D3300}
.warn .wh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.warn ul{list-style:none;margin:8px 0 0;padding:0}
.warn li{display:flex;gap:8px;padding:5px 0;font-size:13px;line-height:1.35}
.warn li i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:#C9A400}
.warn li i.hi{background:var(--bad)}
.warn.okw{background:#E8F4EA;border-color:#9CCFA6;color:var(--ok)}
.h{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--navy);text-transform:uppercase;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.badge{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:8px}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:4px;vertical-align:2px}
.chip.quick{background:#FFF1D6;color:#8A5A00;border:1px solid #F0D9A8}
table.cmp .qtag{font-size:8.5px;font-weight:700;letter-spacing:.3px;color:#8A5A00;background:#FFF1D6;border-radius:4px;padding:1px 4px;display:table;margin:0 0 3px auto}
.chip.prov{background:#FFF1D6;color:#8A5A00}.chip.pre{background:#DCE8FB;color:var(--blue)}.chip.nc{background:#F9D7D3;color:var(--bad)}
.summary{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.sorts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:600 12px inherit;color:var(--ink);margin-left:4px}
.sorts button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.co{display:flex;gap:12px;align-items:center;cursor:pointer}
.co .badge{width:48px;height:48px;font-size:20px;flex:none}
.co .mid{flex:1;min-width:0}
.co .t{font-weight:700;font-size:16px}
.co .n{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .right{text-align:right;flex:none}
.co .fv{font-weight:700}
.co{flex-wrap:wrap}
.co .how{font-size:11px;color:var(--muted);line-height:1.35;margin-top:3px;white-space:nowrap}
.co .ind{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{flex-basis:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.kpis div{text-align:center;min-width:0}
.kpis .k{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;white-space:nowrap}
.kpis .v{font-size:14px;font-weight:700;margin-top:1px;white-space:nowrap}
.kpis .d{font-size:10.5px;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15px inherit;background:#fff;margin-bottom:8px}
.sectors{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sectors::-webkit-scrollbar{display:none}
.sectors button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:600 12px inherit;color:var(--ink)}
.sectors button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sectors button span{opacity:.6;font-weight:400;margin-left:3px}
.gr{border-top:1px solid var(--line);cursor:pointer}
.gr:first-of-type{border-top:0}
.gr .top{display:flex;align-items:center;gap:9px;padding:9px 0}
.gr .top i{width:11px;height:11px;border-radius:3px;flex:none}
.gr .nm{flex:1;font-size:14px}
.gr .pts{font-size:14px;color:var(--muted)}
.gr .pts b{color:var(--ink);font-size:16px}
.gr .caret{width:12px;color:var(--muted);font-size:12px;display:inline-block;transition:transform .15s;text-align:center}
.gr.open .caret{transform:rotate(90deg)}
.gr .bubble{display:none;background:var(--soft);border-radius:10px;padding:8px 12px 8px 4px;margin:0 0 10px;font-size:13px;position:relative}
.gr .bubble:before{content:"";position:absolute;top:-6px;left:22px;border:6px solid transparent;border-top:0;border-bottom-color:var(--soft)}
.gr.open .bubble{display:block}
.gr.total{cursor:default;border-top:2px solid var(--line)}
.gr.total .nm{font-weight:700}
.bubble ul,.ptr ul{margin:0;padding-left:20px}
.bubble li,.ptr li{margin:3px 0}
.ptr{margin-top:12px;font-size:13px}
.ptr .pt{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--navy);text-transform:uppercase;margin-bottom:4px}
.cmpbtn{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px;font:600 13px inherit;color:var(--navy)}
.look{display:flex;gap:8px;margin-top:8px}
.look input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:14px inherit;text-transform:uppercase}
.look button,.set button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:0 14px;font:600 13px inherit}
.set input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:14px inherit;margin:6px 0}
.set .row2{display:flex;gap:8px}
.set .row2 button{padding:9px 14px}
.set table.looked td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.set button.x{background:var(--soft);color:var(--muted);border-radius:999px;width:30px;height:30px;padding:0;font-size:13px}
.cmp-sel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cmp-sel span{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border-radius:999px;padding:5px 6px 5px 11px;font-weight:700;font-size:13px}
.cmp-sel span button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;width:20px;height:20px;font-size:12px;line-height:20px;padding:0}
.cmp-pick{display:flex;gap:8px}
.cmp-pick select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px;font:14px inherit;background:#fff;color:var(--ink)}
.cmp-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.cmp{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
table.cmp th,table.cmp td{padding:6px 6px;border-top:1px solid var(--line);white-space:nowrap;text-align:right}
table.cmp th:first-child,table.cmp td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1;
  white-space:normal;min-width:118px;max-width:132px;padding-left:0;box-shadow:1px 0 0 var(--line)}
table.cmp thead th{border-top:0;vertical-align:bottom;font-size:13px;color:var(--ink);letter-spacing:0}
table.cmp thead .badge{width:30px;height:30px;font-size:13px;border-radius:7px;margin-bottom:3px}
table.cmp tr.sec td,table.cmp tr.hlp td{position:static;max-width:none;min-width:0;box-shadow:none;background:transparent;text-align:left;white-space:normal}
table.cmp tr.sec td{border-top:0;padding-top:14px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--navy);text-transform:uppercase}
table.cmp .stk{position:sticky;left:0;display:inline-block;max-width:330px}
table.cmp tr.row td:first-child{font-size:12.5px;line-height:1.3}
table.cmp td.best{background:#E3F3E6;color:var(--ok);font-weight:700}
table.cmp tr.row td:first-child{cursor:pointer}
table.cmp tr.hlp td{border-top:0;padding-top:0;color:var(--muted);font-size:11.5px}
table.cmp .arr{color:var(--muted);font-size:11px}
.blk .line{padding:5px 0 5px 10px;border-left:3px solid var(--line);margin:5px 0;font-size:13px}
.up{color:var(--ok)}.down{color:var(--bad)}
.hero{display:flex;gap:14px;align-items:center}
.hero .badge{width:76px;height:76px;font-size:34px;border-radius:12px;flex:none}
.hero .t{font:700 22px Georgia,serif}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.facts span{background:var(--soft);border-radius:6px;padding:3px 8px;font-size:12px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:6px 0 8px}
.stack i{display:block;height:100%;border-right:2px solid #fff}
.rows .r{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.blk{border-top:1px solid var(--line);padding:10px 0 8px;cursor:pointer}
.blk:first-of-type{border-top:0;padding-top:2px}
.blk .top{display:flex;align-items:center;gap:10px}
.blk .name{font-weight:700;font-size:12px;letter-spacing:.5px;width:104px;color:var(--muted)}
.blk .bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.blk .bar i{display:block;height:100%;border-radius:4px}
.blk .val{width:40px;text-align:right;font-weight:700;font-size:16px}
.blk .w{font-size:11px;color:var(--muted);width:34px;text-align:right}
.blk .more{display:none;margin:8px 0 2px;font-size:13px}
.blk.open .more{display:block}
.blk .caret{color:var(--muted);font-size:12px;width:10px;display:inline-block;transition:transform .15s}
.blk.open .caret{transform:rotate(90deg)}
.item{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:6px}
.item .l{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.item .why{color:var(--muted);font-size:12px;margin-top:2px}
.item .sc{color:var(--muted);font-size:11px;margin-top:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--soft);border-radius:8px;padding:9px 10px}
.tile .k{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.tile .v{font-size:19px;font-weight:700;margin:2px 0}
.tile .s{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.5px;color:var(--muted);text-align:right;font-weight:700;padding:4px 2px}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:5px 2px;border-top:1px solid var(--line)}
tr.w td{font-weight:700}
.vals{display:flex;gap:8px;margin-bottom:10px}
.vals>div{flex:1;background:var(--soft);border-radius:8px;padding:9px 10px}
.vals .k{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.vals .v{font-size:20px;font-weight:700}
.donut{display:flex;gap:14px;align-items:center}
.donut svg{flex:none}
.legend{flex:1;font-size:13px}
.legend div{display:flex;align-items:center;gap:7px;padding:2px 0}
.legend b{margin-left:auto;font-weight:700}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.mx-meet{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px}
.mx-g{display:flex;gap:12px;align-items:flex-start}
.mx-g .gb{flex:none;width:62px;height:62px;border-radius:10px;color:#fff;font-weight:700;font-size:26px;line-height:62px;text-align:center}
.mx-b{margin-top:8px;font-size:13px;line-height:1.35;display:grid;grid-template-columns:30px 1fr;column-gap:6px}

.mx-tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mx-t{background:var(--soft);border-radius:10px;padding:8px 10px}
.mx-t .l{font-size:11px;font-weight:700;color:var(--muted)}
.mx-t .v{font-size:19px;font-weight:700}
.mx-t .a,.mx-t .b{font-size:11px;color:var(--muted);line-height:1.3}
.mx-i{color:var(--muted);font-weight:700;cursor:pointer;padding:0 2px;text-transform:none;letter-spacing:0}
.mx-tip{text-transform:none;letter-spacing:0;font-weight:400}
.mx-tip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:5px;color:var(--ink)}
.mx-c svg{width:100%;height:auto;display:block}
.mx-c .leg{font-size:12px;display:flex;gap:12px;margin-top:4px}
.mx-c .leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.grades{display:flex;flex-wrap:wrap;gap:5px}
.grades span{border-radius:6px;color:#fff;font-weight:700;font-size:12px;padding:3px 7px}
p{margin:6px 0}
.hist{display:flex;align-items:flex-end;gap:5px;height:96px;margin-top:6px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}

.hist span{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap}
</style>

<script>
"use strict";
const RELAY = "https://tarsier-relay.rmsdelaunay.workers.dev";
const GH = {owner: "rsdelaunay", repo: "tarsier"};
let D = null, sortBy = "grade", selQ = null, selT = null, sector = "All", query = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gcol = g => g ? `var(--g${g[0]})` : "var(--gN)";
const scol = s => s == null ? "var(--line)" : s >= 80 ? "var(--ok)" : s >= 60 ? "var(--gold)" : "var(--bad)";
const BLOCK = {growth:"Growth", profitability:"Profitability", cash:"Cash", balance:"Balance", execution:"Execution"};
const BCOL = {growth:"#2a78d6", profitability:"#1baf7a", cash:"#eda100", balance:"#6250d6", execution:"#eb6834"};
const SLOTS = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#6250d6"];
const money = v => v == null ? "—" : (Math.abs(v) >= 1000 ? `$${(v/1000).toFixed(1)}B` : `$${Math.round(v).toLocaleString("en-US")}M`).replace("$-", "−$");
const usd = v => v == null ? "—" : "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (v, s) => v == null ? "—" : (s && v > 0 ? "+" : "") + v.toFixed(1) + "%";

async function load() {
  if (window.TARSIER_DATA) { D = window.TARSIER_DATA; route(); return; }
  try {
    const r = await fetch("data.json?" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
  } catch (e) {
    D = window.TARSIER_DATA || null;
  }
  route();
  // the phone's own look-ups arrive a moment later: redraw, unless the user is typing
  loadRaw().then(() => { const a = document.activeElement; if (!(a && a.tagName == "INPUT")) route(); });
}

// ---------- this phone's own look-ups, shared through the GitHub repository ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
let RAW = {};          // ticker -> {ticker, name, cik, fetched, source, column}
async function loadRaw() {
  RAW = Object.assign({}, LS.get("tarsier.raw", {}));
  try {
    const r = await fetch("raw/index.json?" + Date.now(), {cache: "no-store"});
    if (r.ok) {
      const idx = (await r.json()).tickers || {};
      await Promise.all(Object.keys(idx).map(async t => {
        if (RAW[t] && RAW[t].fetched >= (idx[t].fetched || "")) return;
        try { const x = await fetch(`raw/${t}.json?` + Date.now(), {cache: "no-store"}); if (x.ok) RAW[t] = await x.json(); } catch (e) {}
      }));
    }
  } catch (e) {}
  LS.set("tarsier.raw", RAW);
}
const graded = t => D && D.companies.find(c => c.ticker == t && c.compare);
// companies graded on the phone (and not yet by the PC) join the PC's list everywhere
function phoneGraded() { return Object.values(RAW).filter(r => r && r.company && r.company.latest && !graded(r.ticker)).map(r => r.company); }
function allCos() { return D ? [...D.companies, ...phoneGraded()] : []; }
const anyGraded = t => allCos().find(c => c.ticker == t && c.compare);
function rawOnly() { return Object.values(RAW).filter(r => r && r.column && !anyGraded(r.ticker)); }

function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
async function ghPut(path, text, message) {
  const token = LS.get("tarsier.token", "");
  if (!token) return false;
  const api = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
  const hdr = {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"};
  let sha;
  const g = await fetch(api, {headers: hdr, cache: "no-store"});
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status == 401) throw new Error("GitHub refused the token (Settings tab).");
  const p = await fetch(api, {method: "PUT", headers: hdr, body: JSON.stringify({message, content: b64(text), sha})});
  if (!p.ok) throw new Error(`GitHub answered ${p.status} while saving ${path}.`);
  return true;
}
async function ghDelete(path, message) {
  const token = LS.get("tarsier.token", "");
  if (!token) return false;
  const api = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
  const hdr = {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"};
  const g = await fetch(api, {headers: hdr, cache: "no-store"});
  if (g.status == 404) return true;
  if (!g.ok) throw new Error(`GitHub answered ${g.status}.`);
  const d = await fetch(api, {method: "DELETE", headers: hdr, body: JSON.stringify({message, sha: (await g.json()).sha})});
  if (!d.ok) throw new Error(`GitHub answered ${d.status} while removing ${path}.`);
  return true;
}
async function ghGetJSON(path) {
  const token = LS.get("tarsier.token", "");
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`,
    {headers: Object.assign({Accept: "application/vnd.github.raw+json"}, token ? {Authorization: "Bearer " + token} : {}), cache: "no-store"});
  return r.ok ? r.json() : null;
}

// ---------- live prices through the relay (kept 15 minutes on the phone) ----------
const PX = () => LS.get("tarsier.px", {});
async function livePrice(t) {
  const c = PX()[t];
  if (c && Date.now() - c.at < 15 * 60 * 1000) return c;
  const r = await fetch(`${RELAY}/price/${encodeURIComponent(t)}`);
  if (!r.ok) throw new Error(`no price for ${t}`);
  const m = (((await r.json()).chart || {}).result || [])[0];
  const p = m && m.meta && m.meta.regularMarketPrice;
  if (!p) throw new Error(`no price for ${t}`);
  const out = {price: p, time: m.meta.regularMarketTime ? new Date(m.meta.regularMarketTime * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC" : "", at: Date.now()};
  const all = PX(); all[t] = out; LS.set("tarsier.px", all);
  return out;
}
let pxBusy = false, pxNote = "";
const pxFailed = {};                                // ticker -> when its price last failed: wait 2 minutes
async function refreshPrices(ts) {
  if (pxBusy) return;
  const now = Date.now();
  const stale = ts.filter(t => { const c = PX()[t]; return (!c || now - c.at >= 15 * 60 * 1000) && !(now - (pxFailed[t] || 0) < 120000); });
  if (!stale.length) return;
  pxBusy = true;
  const miss = [];
  await Promise.all(stale.map(t => livePrice(t).catch(() => { miss.push(t); pxFailed[t] = Date.now(); })));
  pxBusy = false;
  pxNote = miss.length ? "No live price for: " + miss.join(", ") + "." : "";
  if ((location.hash || "").startsWith("#/compare")) route();
}

// ---------- look up any US-listed company at the SEC, from the phone ----------
async function cikOf(t) {
  let map = LS.get("tarsier.cik", null);
  if (!map || Date.now() - (map._at || 0) > 7 * 864e5) {
    const r = await fetch(`${RELAY}/sec/tickers`);
    if (!r.ok) throw new Error("the SEC list of companies did not load");
    const j = await r.json();
    map = {_at: Date.now()};
    Object.values(j).forEach(x => { map[String(x.ticker).toUpperCase()] = [x.cik_str, x.title]; });
    LS.set("tarsier.cik", map);
  }
  const hit = map[t] || map[t.replace(".", "-")];
  if (!hit) throw new Error(`${t} is not listed at the SEC (a foreign company filing 20-F, or a typo?)`);
  return {cik: "CIK" + String(hit[0]).padStart(10, "0"), name: hit[1]};
}
let lookMsg = "";
// ---------- the Tarsier engine itself (the PC's Python code), run in the phone's browser ----------
let PY = null, pyLoading = null;
function loadScript(src) {
  return new Promise((ok, bad) => { const e = document.createElement("script"); e.src = src; e.onload = ok; e.onerror = () => bad(new Error("could not load " + src)); document.head.appendChild(e); });
}
async function engine(say) {
  if (PY) return PY;
  if (pyLoading) return pyLoading;
  pyLoading = (async () => {
    say("Loading the Tarsier engine (the first time it downloads about 14 MB; then it is kept on the phone)…");
    const base = new URL("py/", location.href).href;
    if (typeof loadPyodide == "undefined") await loadScript(base + "pyodide/pyodide.js");
    const py = await loadPyodide({indexURL: base + "pyodide/"});
    await py.loadPackage([base + "wheels/et_xmlfile-2.0.0-py3-none-any.whl", base + "wheels/openpyxl-3.1.5-py2.py3-none-any.whl"]);
    const z = await fetch(base + "engine.zip", {cache: "no-cache"});
    if (!z.ok) throw new Error("engine.zip did not load");
    py.unpackArchive(new Uint8Array(await z.arrayBuffer()), "zip", {extractDir: "/tarsier"});
    py.runPython("import sys; sys.path.insert(0, '/tarsier'); from engine import phone_engine");
    PY = py;
    return py;
  })();
  try { return await pyLoading; } catch (e) { pyLoading = null; throw e; }
}
function engineGrade(py, t, factsText, subsText, px) {
  py.globals.set("T_", t); py.globals.set("F_", factsText); py.globals.set("S_", subsText || null);
  py.globals.set("P_", px ? px.price : null); py.globals.set("PT_", px ? px.time : null);
  return JSON.parse(py.runPython("phone_engine.grade(T_, F_, S_, P_, PT_)"));
}

async function lookUp(raw) {
  const t = String(raw || "").trim().toUpperCase();
  if (!/^[A-Z][A-Z0-9.\-]{0,9}$/.test(t)) { lookMsg = "Type a ticker, e.g. MSFT."; route(); return; }
  const say = m => { lookMsg = m; route(); };
  say(`Getting ${t} from the SEC…`);
  let company = null;
  try {
    const {cik, name} = await cikOf(t);
    const r = await fetch(`${RELAY}/sec/facts/${cik}`);
    if (!r.ok) throw new Error(`the SEC has no financial data for ${t}`);
    const factsText = await r.text();
    const facts = JSON.parse(factsText);
    let subsText = null;
    try { const s2 = await fetch(`${RELAY}/sec/submissions/${cik}`); if (s2.ok) subsText = await s2.text(); } catch (e) {}
    let px = null;
    try { px = await livePrice(t); } catch (e) {}
    let column = null, how = "";
    try {                                      // the full grade, with the PC's own code
      const py = await engine(say);
      say(`Grading ${t}…`);
      company = engineGrade(py, t, factsText, subsText, px);
      column = company.compare;
      how = `graded ${company.latest.grade} (${company.latest.label}, ${company.latest.score} / 100) on the phone, quick look.`;
    } catch (e) {                              // the engine could not run: the raw Compare numbers still can
      company = null;
      column = TSEC.compute(facts, px ? px.price : null);
      how = `raw numbers only (the engine could not run: ${e.message}).`;
    }
    const entry = {ticker: t, name: (company && company.name) || facts.entityName || name, cik, fetched: new Date().toISOString(),
                   source: "phone", column, company};
    RAW[t] = entry;
    if (!LS.set("tarsier.raw", RAW)) { const lite = Object.assign({}, RAW); LS.set("tarsier.raw", lite); }
    cmpLoad(); if (!cmpSel.includes(t)) { if (cmpSel.length >= 5) cmpSel.pop(); cmpSel.push(t); } cmpSave();
    lookMsg = `${t}: ${how}`;
    try {
      const saved = await ghPut(`raw/${t}.json`, JSON.stringify(entry), `Phone: look up ${t}`);
      if (saved) {
        const idx = (await ghGetJSON("raw/index.json")) || {tickers: {}};
        idx.tickers = idx.tickers || {}; idx.tickers[t] = {fetched: entry.fetched, source: "phone"};
        await ghPut("raw/index.json", JSON.stringify(idx, null, 1), `Phone: list ${t}`);
        lookMsg += " Saved for the PC too.";
      } else lookMsg += " Kept on this phone (add the GitHub token in Settings to share it with the PC).";
    } catch (e) { lookMsg += " Not shared with the PC: " + e.message; }
  } catch (e) { lookMsg = "Could not get it: " + e.message; company = null; }
  if (company) { query = ""; location.hash = "#/c/" + t; } else location.hash = "#/compare";
  route();
}

// graded automatically (Compare on the PC, or looked up on the phone) and not analysed yet
function quickOf(c) { return c && c.compare && c.compare.quick; }
function quickChip(c) {
  const k = quickOf(c);
  return k ? `<span class="chip quick" title="Graded automatically from the SEC filings; not analysed yet">QUICK LOOK</span>` : "";
}
function chips(q) {
  return (q.preliminary ? '<span class="chip pre">PRELIMINARY</span>' : "") +
         (q.unsupported ? '<span class="chip nc">NOT COMPARABLE</span>' : "") +
         (q.provisional && !q.preliminary ? '<span class="chip prov">PROVISIONAL</span>' : "");
}

function spark(hist) {
  const h = hist.slice(-8), w = 64, ht = 22, bw = w / 8 - 2;
  return `<svg width="${w}" height="${ht}" aria-hidden="true">` + h.map((x, i) => {
    const v = Math.max(4, (x.score || 0) / 100 * ht);
    return `<rect x="${i * (bw + 2)}" y="${ht - v}" width="${bw}" height="${v}" rx="1.5" fill="${gcol(x.grade)}" opacity="${i == h.length - 1 ? 1 : .55}"/>`;
  }).join("") + "</svg>";
}

function kpis(c) {
  const h = c.history[c.history.length - 1], n = h && h.numbers;
  if (!n) return "";
  const a = n.cur, p = n.prior || {};
  const pp = (x, y) => x == null || y == null ? "" : `<div class="d ${x >= y ? "up" : "down"}">${x - y >= 0 ? "+" : "−"}${Math.abs(x - y).toFixed(1)}pp</div>`;
  const P = v => v == null ? "—" : v.toFixed(1) + "%";
  const eps = v => v == null ? "—" : (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(2);
  const epsCh = a.eps == null || p.eps == null ? "" : p.eps > 0 && a.eps > 0 ?
    `<div class="d ${a.eps >= p.eps ? "up" : "down"}">${pct((a.eps / p.eps - 1) * 100, 1)}</div>` :
    `<div class="d ${a.eps >= p.eps ? "up" : "down"}">${a.eps >= p.eps ? "better" : "worse"}</div>`;
  const cell = (k, v, d) => `<div><div class="k">${k}</div><div class="v">${v}</div>${d || '<div class="d">&nbsp;</div>'}</div>`;
  return `<div class="kpis">
    ${cell("REV YoY", pct(a.revenue_yoy, 1), `<div class="d muted">${money(a.revenue)}</div>`)}
    ${cell("GROSS", P(a.gross), pp(a.gross, p.gross))}
    ${cell("OPERATING", P(a.operating), pp(a.operating, p.operating))}
    ${cell("NET", P(a.net), pp(a.net, p.net))}
    ${cell("EPS GAAP", eps(a.eps), epsCh)}</div>`;
}

function howShort(v) {
  const h = v && v.how;
  if (!h || h.target == null) return "fair value";
  const yr = esc((h.year || "").replace("E", ""));
  const t0 = "$" + Math.round(h.target).toLocaleString("en-US");
  return `${h.multiple != null ? h.multiple.toFixed(1) + "× " + esc(h.basis || "") + " in " : "target "}${yr}<br>${t0} · disc. ${h.discount_rate}%/yr`;
}

function cardHtml(c) {
  const q = c.latest, v = c.valuation;
  const right = v && v.fair_value != null ? `<div class="fv">${usd(v.fair_value)}</div>
     ${v.upside != null ? `<div class="tiny ${v.upside >= 0 ? "up" : "down"}">${pct(v.upside, 1)} vs price</div>` : ""}
     <div class="how">${howShort(v)}</div>` : "";
  return `<div class="card co" onclick="location.hash='#/c/${c.ticker}'">
    <div class="badge" style="background:${gcol(q.grade)}">${esc(q.grade || "—")}</div>
    <div class="mid"><div class="t">${esc(c.ticker)} ${quickChip(c)}${chips(q)}</div><div class="n">${esc(c.name)}</div>
      <div class="ind">${esc(c.industry || c.sector || "")}</div>
      <div class="tiny muted">${esc(q.label)} · ${q.score ?? "n/a"} / 100 ${spark(c.history)}</div></div>
    <div class="right">${right}</div>${kpis(c)}</div>`;
}

function listHtml() {
  const qy = query.trim().toLowerCase();
  const cs = allCos().filter(c => (sector == "All" || (c.sector || "Other") == sector) &&
    (!qy || c.ticker.toLowerCase().includes(qy) || (c.name || "").toLowerCase().includes(qy) || (c.industry || "").toLowerCase().includes(qy)));
  const up = c => c.valuation && c.valuation.upside;
  if (sortBy == "upside") cs.sort((a, b) => (up(b) ?? -1e9) - (up(a) ?? -1e9));
  else if (sortBy == "az") cs.sort((a, b) => a.ticker.localeCompare(b.ticker));
  else cs.sort((a, b) => (b.latest.score || 0) - (a.latest.score || 0));
  const tk = query.trim().toUpperCase();
  const look = /^[A-Z][A-Z0-9.\-]{0,9}$/.test(tk) ? `<br><button class="cmpbtn" style="width:auto;padding:9px 16px" onclick="lookUp('${tk}')">Get ${esc(tk)} from the SEC and grade it →</button>` : "";
  return (cs.length ? cs.map(cardHtml).join("") : `<div class="empty">Nothing matches.${look}</div>`) +
    (D.skipped && D.skipped.length ? `<p class="note">Not shown: ${D.skipped.map(s => esc(s[0])).join(", ")} (no quarterly SEC data).</p>` : "");
}

function setSector(s) { sector = s; route(); }
function setQuery(v) { query = v; $("#list").innerHTML = listHtml(); }

function research() {
  if (!D || !allCos().length) return `<div class="empty">No companies yet.<br>Grade one in Tarsier on your PC, then press Publish to phone.</div>`;
  const count = {};
  allCos().forEach(c => { const k = c.sector || "Other"; count[k] = (count[k] || 0) + 1; });
  const secs = Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b));
  if (sector != "All" && !count[sector]) sector = "All";
  return `<input class="search" type="search" placeholder="Search ticker, company or industry" value="${esc(query)}" oninput="setQuery(this.value)">
    <div class="sectors">${[["All", allCos().length], ...secs.map(k => [k, count[k]])].map(([k, n]) =>
      `<button class="${sector == k ? "on" : ""}" onclick='setSector(${JSON.stringify(k)})'>${esc(k)}<span>${n}</span></button>`).join("")}</div>
    <div class="summary"><span class="small muted">Updated ${esc(D.generated)}</span>
    <span class="sorts">${[["grade","Grade"],["upside","Upside"],["az","A–Z"]].map(([k, l]) =>
      `<button class="${sortBy == k ? "on" : ""}" onclick="sortBy='${k}';route()">${l}</button>`).join("")}</span></div>
    ${lookMsg ? `<p class="note">${esc(lookMsg)}</p>` : ""}
    <div id="list">${listHtml()}</div>`;
}

function blockRow(b) {
  if (b.lines) {
    const ls = b.lines.map(l => `<div class="line">${esc(l)}</div>`).join("");
    return `<div class="blk" onclick="this.classList.toggle('open')"><div class="top">
      <span class="caret">▸</span><span class="name">${BLOCK[b.key].toUpperCase()}</span>
      <span class="bar"><i style="width:${b.score ?? 0}%;background:${scol(b.score)}"></i></span>
      <span class="val">${b.score ?? "n/a"}</span></div>
      <div class="more">${ls || '<div class="line">No figures this quarter.</div>'}</div></div>`;
  }
  const d = b.detail, it = d.items.map(x => `<div class="item"><div class="l"><span>${esc(x.label)}</span>
      <span>${esc(x.value)} → ${x.points} pts</span></div>
      ${x.share != null ? `<div class="why">counts ${x.share}% of this block</div>` : ""}
      ${x.why ? `<div class="why">${esc(x.why)}</div>` : ""}${x.scale ? `<div class="sc">scale: ${esc(x.scale)}</div>` : ""}</div>`).join("");
  const extra = (b.key == "execution" && b.score == null) ? `<div class="item"><div class="why">No inputs yet (guidance and consensus). Until they are entered, this block's weight is shared by the other four.</div></div>` :
    (d.waiting.length ? `<div class="item"><div class="why">Not available this quarter: ${esc(d.waiting.join(", "))}</div></div>` : "");
  return `<div class="blk" onclick="this.classList.toggle('open')"><div class="top">
      <span class="caret">▸</span><span class="name">${BLOCK[b.key].toUpperCase()}</span>
      <span class="bar"><i style="width:${b.score ?? 0}%;background:${scol(b.score)}"></i></span>
      <span class="val">${b.score ?? "n/a"}</span><span class="w">${b.weight}%</span></div>
      <div class="more">${it}${extra}</div></div>`;
}

function pointers(list, title) {
  return `<div class="ptr">${title ? `<div class="pt">${esc(title)}</div>` : ""}<ul>${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
}

function capFmt(w) { return Math.abs(w - Math.round(w)) < 0.05 ? String(Math.round(w)) : w.toFixed(1); }

function gradeCard(q) {
  const total = q.grade_rows.reduce((a, r) => a + r.points, 0) || 1;
  const rows = q.grade_rows.map(r => {
    const b = q.blocks.find(x => x.key == r.block) || {}, ls = b.lines || [];
    return `<div class="gr" onclick="this.classList.toggle('open')">
      <div class="top"><i style="background:${BCOL[r.block]}"></i><span class="nm">${BLOCK[r.block]}</span>
        <span class="pts"><b>${r.points.toFixed(1)}</b> / ${capFmt(r.weight)}</span><span class="caret">▸</span></div>
      <div class="bubble">${ls.length ? `<ul>${ls.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : "No figures this quarter."}</div></div>`;
  }).join("");
  const missing = q.blocks.filter(b => b.score == null).map(b => BLOCK[b.key]);
  return `<div class="card"><div class="h">How the grade adds up · ${esc(q.label)} <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">· tap a line</span></div>
    <div class="stack">${q.grade_rows.map(r => `<i style="width:${r.points / total * 100}%;background:${BCOL[r.block]}"></i>`).join("")}</div>
    ${rows}
    <div class="gr total"><div class="top"><span class="nm">Score</span><span class="pts"><b>${q.score}</b> / 100</span><span class="caret"></span></div></div>
    ${missing.length ? `<p class="note">${esc(missing.join(", "))}: no data yet, so the other blocks count for more.</p>` : ""}
    ${q.house_rules ? pointers(q.house_rules.split("; "), "House rule applied") : ""}</div>`;
}

let cmpSel = null;
function cmpLoad() {
  if (cmpSel) return;
  try { cmpSel = JSON.parse(localStorage.getItem("tarsier.compare") || "null"); } catch (e) { cmpSel = null; }
  const have = new Set([...allCos().filter(c => c.compare).map(c => c.ticker), ...rawOnly().map(r => r.ticker)]);
  cmpSel = (Array.isArray(cmpSel) ? cmpSel : []).filter(t => have.has(t)).slice(0, 5);
  if (!cmpSel.length) cmpSel = [...allCos()].filter(c => c.compare)
    .sort((a, b) => (b.latest.score || 0) - (a.latest.score || 0)).slice(0, 3).map(c => c.ticker);
}
function cmpSave() { try { localStorage.setItem("tarsier.compare", JSON.stringify(cmpSel)); } catch (e) {} }
function cmpAdd(t) { cmpLoad(); if (t && !cmpSel.includes(t) && cmpSel.length < 5) cmpSel.push(t); cmpSave(); route(); }
// one Compare column, graded on the PC or looked up on the phone, at the freshest price there is
function cmpCol(t) {
  const g = anyGraded(t), r = RAW[t];
  const base = g ? Object.assign({}, g.compare, {_name: g.name, _grade: g.latest.grade, _src: "pc"})
             : r && r.column ? Object.assign({}, r.column, {_name: r.name, _grade: null, _src: "phone", _fetched: r.fetched}) : null;
  if (!base) return null;
  const live = PX()[t];
  if (live && live.price && typeof TSEC != "undefined") {
    const c = TSEC.reprice(base, live.price);
    c.price_source = "live, " + live.time;
    return c;
  }
  return base;
}
function cmpDel(t) { cmpSel = cmpSel.filter(x => x != t); cmpSave(); route(); }
function cmpSector(s) {
  if (!s) return;
  cmpSel = s == "Looked up on the phone" ? rawOnly().map(r => r.ticker).slice(0, 5)
    : allCos().filter(c => c.compare && (c.sector || "Other") == s)
      .sort((a, b) => (b.latest.score || 0) - (a.latest.score || 0)).slice(0, 5).map(c => c.ticker);
  cmpSave(); route();
}
function cmpWith(t) { cmpLoad(); if (!cmpSel.includes(t)) { if (cmpSel.length >= 5) cmpSel.pop(); cmpSel.unshift(t); } cmpSave(); location.hash = "#/compare"; }

function cfmt(kind, v) {
  if (v == null) return "—";
  if (kind == "grade") return `${esc(v[0] || "—")} ${v[1] != null ? v[1].toFixed(1) : ""}`;
  if (kind == "text") return esc(v);
  if (kind == "money") { const a = Math.abs(v); return (v < 0 ? "−" : "") + (a >= 1e3 ? "$" + (a / 1e3).toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + "B" : "$" + Math.round(a).toLocaleString("en-US") + "M"); }
  if (kind == "usd") return usd(v);
  if (kind == "eps") return (v < 0 ? "−" : "") + "$" + Math.abs(v).toFixed(2);
  if (kind == "pct") return v.toFixed(1) + "%";

function cbest(cols, key, kind, better) {
  if (!better) return -1;
  const vals = cols.map((c, i) => {
    let v = c[key];
    if (v == null) return null;
    if (kind == "grade") v = v[1];
    if (typeof v != "number") return null;
    if (["pe", "fpe", "peg", "ev_sales", "ev_ebitda"].includes(key) && v <= 0) return null;
    return [i, v];
  }).filter(Boolean);
  if (vals.length < 2) return -1;
  const pick = vals.reduce((a, b) => (better == "high" ? b[1] > a[1] : b[1] < a[1]) ? b : a);
  return vals.filter(x => x[1] == pick[1]).length > 1 ? -1 : pick[0];
}

function donut(items, colour) {

      stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"/>`;
    off += len; return s;

  return `<div class="donut"><svg width="128" height="128" viewBox="0 0 128 128">${arcs}</svg>
    <div class="legend">${items.map(([n, w]) => `<div><i style="background:${colour(n)}"></i>${esc(n)}<b>${w.toFixed(1)}%</b></div>`).join("")}</div></div>`;

function fold(list, max = 8) {

    let base = null; ts.forEach((t, i) => { if (t < jan1 && cl[i] > 0) base = cl[i]; });

}

    meet = `<div class="mx-meet">${MX_SIGN}<span>Next Fed decision: <b>${mxPeriod(next[0], "d")}</b> (${days == 0 ? "today" : days == 1 ? "tomorrow" : "in " + days + " days"})${next.length > 1 ? "<br>then " + next.slice(1, 4).map(d => mxPeriod(d, "d")).join(" · ") : ""}</span></div>`; }
  const G = X.grade;
  const gcard = G ? `<div class="card"><div class="mx-g"><div class="gb" style="background:${MXG[G.grade[0]] || "#C5CBD3"}">${esc(G.grade)}</div>
      <div><div style="font-weight:700;font-size:15px">US economy · ${Math.round(G.score)} / 100</div>${G.notes && G.notes.length ? pointers(G.notes) : ""}</div></div>
      ${G.blocks.map(b => `<div class="mx-b"><span class="s">${Math.round(b.score)}</span><span><b>${esc(b.name)}: ${esc(b.verdict || "")}</b><br><span class="muted small">${esc(b.why)}</span></span></div>`).join("")}</div>` : "";
  const C = X.charts || {};
  return `<div class="card"><div class="h">Macroeconomy · United States</div>${meet}</div>
    ${gcard}
    ${mxChart("cpi", "Inflation: CPI, year on year", C.cpi || {}, 2)}
    ${mxChart("pce", "Inflation: PCE, year on year", C.pce || {}, 2)}
    ${mxChart("unrate", "Unemployment rate", C.unrate || {}, null)}
    ${MX_TILES.map(([g, items]) => `<div class="card"><div class="h">${g}</div><div class="mx-tiles">${items.map(t => mxTile(X, t)).join("")}</div></div>`).join("")}
    <p class="note" style="text-align:center">From the PC's last Sync (figures of ${esc(X.when || "")}).<br>Source: FRED, Federal Reserve Bank of St. Louis. Market expects: Tarsier's reading of 30-day fed funds futures.</p>`;
}

function method() {
  const g = D ? D.grades : [];
  return `<div class="card"><div class="h">What Tarsier does</div>
    <p>Every quarter a company reports to the SEC. Tarsier reads the filing, compares the quarter with the same quarter a year earlier, and grades it from <b>A+</b> to <b>F</b>.</p>
    <p class="small muted">See past the headlines: one grade, and the reasons behind it.</p></div>
  <div class="card"><div class="h">Five blocks</div><table>
    <tr><th>Block</th><th>Growth co.</th><th>Mature co.</th></tr>
    <tr><td><b>Growth</b> <span class="tiny muted">revenue vs a year ago</span></td><td>30%</td><td>15%</td></tr>
    <tr><td><b>Profitability</b> <span class="tiny muted">margins, EPS</span></td><td>20%</td><td>25%</td></tr>
    <tr><td><b>Cash</b> <span class="tiny muted">free cash flow, stock pay</span></td><td>15%</td><td>30%</td></tr>
    <tr><td><b>Balance</b> <span class="tiny muted">debt, dilution</span></td><td>10%</td><td>20%</td></tr>
    <tr><td><b>Execution</b> <span class="tiny muted">vs guidance and consensus</span></td><td>25%</td><td>10%</td></tr></table>
    <p class="note">A growth company is one whose revenue grows 15% a year or more. A block with no data shares its weight with the others.</p></div>
  <div class="card"><div class="h">From score to grade</div><div class="grades">${g.map(([lo, gr]) => `<span style="background:${gcol(gr)}">${gr} ${lo}+</span>`).join("")}<span style="background:var(--gF)">F</span></div></div>
  <div class="card"><div class="h">Labels</div>
    <p><span class="chip prov">PROVISIONAL</span> fewer than 3 of the 5 Execution inputs: the grade rests on the filing alone.</p>
    <p><span class="chip pre">PRELIMINARY</span> graded from the earnings press release, before the 10-Q reached the SEC.</p>
    <p><span class="chip nc">NOT COMPARABLE</span> banks, lenders and insurers: the scorecard does not fit them yet.</p></div>
  <div class="card"><div class="h">Fair value</div><p class="small">Three scenarios (bear, base, bull) for the next five years give price targets; weighted and brought back to today, after a margin of safety, they give the fair value. A free cash flow valuation at the sector's cost of capital is the cross-check.</p></div>
  <p class="note" style="text-align:center">Tarsier Research ${D ? "v" + esc(D.version) + " · method " + esc(D.method) : ""}<br>Educational analysis, not investment advice.</p>`;
}

function route() {
  const h = location.hash || "#/";
  const m = h.match(/^#\/c\/([A-Z0-9.\-]+)/i);
  $("#hd").classList.toggle("has-back", !!m);
  ["n-w", "n-c", "n-p", "n-x", "n-m", "n-s"].forEach(id => $("#" + id).classList.remove("on"));
  let html;
  if (h.startsWith("#/settings")) { html = settingsPage(); $("#n-s").classList.add("on"); }
  else if (!D) html = `<div class="empty">No data yet.<br>Press Publish to phone in Tarsier on your PC.</div>`;
  else if (m) { html = company(m[1].toUpperCase()); $("#n-w").classList.add("on"); }
  else if (h.startsWith("#/compare")) { html = comparePage(); $("#n-c").classList.add("on"); }
  else if (h.startsWith("#/portfolio")) { html = portfolio(); $("#n-p").classList.add("on"); }
  else if (h.startsWith("#/method")) { html = method(); $("#n-m").classList.add("on"); }
  else if (h.startsWith("#/settings")) { html = settingsPage(); $("#n-s").classList.add("on"); }
  else if (h.startsWith("#/macro")) { html = macroPage(); $("#n-x").classList.add("on"); }
  else { html = research(); $("#n-w").classList.add("on"); }
  $("#app").innerHTML = html;
  if (!m) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
if ("serviceWorker" in navigator && location.protocol == "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
load();
</script>
</body>
</html>
